name: Device Tests

on:
  workflow_call:
    inputs:
      project-path:
        required: true
        type: string
        description: 'Path to the device test project (.csproj) for running tests'
      solution-filter-path:
        required: false
        type: string
        default: ''
        description: 'Path to a solution filter (.slnf) for building. When empty, builds the project-path directly via Arcade scripts.'
      project-name:
        required: true
        type: string
        description: 'Human-readable name for artifact naming (e.g. essentialsai)'
      target-framework:
        required: true
        type: string
        description: 'Target framework to run tests against (e.g. net10.0-maccatalyst, net10.0-android)'
      filter:
        required: false
        type: string
        default: ''
        description: 'Test filter expression (e.g. "RequiresModel!=true")'
      os:
        required: false
        type: string
        default: 'macos-26'
        description: 'Runner label for the job'
      install-workloads:
        required: false
        type: boolean
        default: true
        description: 'Install MAUI workloads (not needed if already present on runner)'
      workloads:
        required: false
        type: string
        default: 'maui macos maccatalyst'
        description: 'Space-separated list of workloads to install (only used when install-workloads is true)'
      xcode-version:
        required: false
        type: string
        default: ''
        description: 'Xcode version to select on macOS (e.g. "26.3"). Empty uses runner default.'
      native-deps:
        required: false
        type: string
        default: ''
        description: 'Shell command to install native dependencies (e.g. apt-get for GTK4)'
      dotnet-args:
        required: false
        type: string
        default: ''
        description: 'Additional arguments to pass to dotnet test'

jobs:
  device-tests:
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        if: inputs.xcode-version != '' && runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_${{ inputs.xcode-version }}.app/Contents/Developer

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install native dependencies
        if: inputs.native-deps != ''
        run: ${{ inputs.native-deps }}

      - name: Install workloads
        if: inputs.install-workloads
        run: dotnet workload install ${{ inputs.workloads }} --version 10.0.203

      - name: Build device tests (macOS)
        if: runner.os == 'macOS'
        run: |
          dotnet restore ${{ inputs.solution-filter-path || inputs.project-path }}
          dotnet build ${{ inputs.solution-filter-path || inputs.project-path }} -c Release --no-restore

      - name: Build device tests (Windows)
        if: runner.os == 'Windows'
        run: |
          dotnet restore ${{ inputs.solution-filter-path || inputs.project-path }}
          dotnet build ${{ inputs.solution-filter-path || inputs.project-path }} -c Release --no-restore
        shell: cmd

      - name: Run device tests
        run: |
          # Hide root solution to prevent CPM solution-level evaluation
          # (macos-26 runner ignores -restore:false and SolutionPath overrides)
          mv MauiLabs.slnx MauiLabs.slnx.bak || true
          dotnet msbuild \
            ${{ inputs.project-path }} \
            -t:VSTest \
            -p:Configuration=Release \
            -p:TargetFramework=${{ inputs.target-framework }} \
            -p:VSTestNoBuild=true \
            -p:VSTestLogger=trx \
            -p:VSTestResultsDirectory=artifacts/TestResults \
            ${{ inputs.filter != '' && format('-p:VSTestTestCaseFilter={0}', inputs.filter) || '' }} \
            -restore:false \
            ${{ inputs.dotnet-args }}
          TEST_EXIT=$?
          mv MauiLabs.slnx.bak MauiLabs.slnx || true
          exit $TEST_EXIT

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ inputs.project-name }}-device-${{ inputs.target-framework }}
          path: artifacts/TestResults/**/*.trx
